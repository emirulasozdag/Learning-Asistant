name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: learning
          POSTGRES_PASSWORD: learning
          POSTGRES_DB: learning_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learning -d learning_assistant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Entegrasyon testleri (tests/test_flow.py) bu veritabanında koşar.
      TEST_DATABASE_URL: postgresql+psycopg://learning:learning@localhost:5432/learning_assistant_test
      # Veritabanı testleri CI'da sessizce atlanamaz (conftest bu durumda testi düşürür).
      REQUIRE_DB_TESTS: "1"
      # CI'da model indirilmez; testler sahte embedder kullanır.
      EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . ../evaluation
      - run: ruff format --check . ../evaluation
      # Temiz başlangıç (#21): boş veritabanında migration'lar baştan sona uygulanır, modellerle
      # aynı olduğu denetlenir (`alembic check`), geri alınır ve yeniden uygulanır.
      - name: Clean-start migrations
        env:
          DATABASE_URL: postgresql+psycopg://learning:learning@localhost:5432/clean_start
          PGPASSWORD: learning
        run: |
          psql -h localhost -U learning -d learning_assistant_test -c "CREATE DATABASE clean_start"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q
      # Değerlendirme harness'inin birim testleri (veritabanısız).
      - run: pytest -q ../evaluation/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
