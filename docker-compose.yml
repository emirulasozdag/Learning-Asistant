services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning}
      POSTGRES_DB: ${POSTGRES_DB:-learning_assistant}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learning} -d ${POSTGRES_DB:-learning_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning}@db:5432/${POSTGRES_DB:-learning_assistant}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-opus-5.5}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-e5}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-base}
      RETRIEVAL_MIN_SIMILARITY: ${RETRIEVAL_MIN_SIMILARITY:-0.78}
      RETRIEVAL_MIN_KEYWORD_COVERAGE: ${RETRIEVAL_MIN_KEYWORD_COVERAGE:-0.5}
      RETRIEVAL_FOLLOW_UP_MIN_SIMILARITY: ${RETRIEVAL_FOLLOW_UP_MIN_SIMILARITY:-0.77}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Yerel geliştirme ve sunum: demo hesapları açılışta oluşturulur, giriş ekranında tek tıkla
      # (şifresiz) girilir ve derslerin katılım kodları görünür. Bu dosya yalnızca yerel geliştirme
      # içindir; uygulamanın kendi varsayılanı kapalıdır. Gerçek kurulumda SEED_DEV_ACCOUNTS=false
      # ve DEMO_LOGIN=false olmalı. .env'deki değerler bu varsayılanların önüne geçer.
      SEED_DEV_ACCOUNTS: ${SEED_DEV_ACCOUNTS:-true}
      DEMO_LOGIN: ${DEMO_LOGIN:-true}
      DEV_INSTRUCTOR_EMAIL: ${DEV_INSTRUCTOR_EMAIL:-ayse.demir@universite.edu.tr}
      DEV_INSTRUCTOR_PASSWORD: ${DEV_INSTRUCTOR_PASSWORD:-demo-egitmen-2026}
      DEV_INSTRUCTOR_NAME: ${DEV_INSTRUCTOR_NAME:-Dr. Ayşe Demir}
      DEV_INSTRUCTOR_TITLE: ${DEV_INSTRUCTOR_TITLE:-Bilgisayar Mühendisliği}
      DEV_STUDENT_EMAIL: ${DEV_STUDENT_EMAIL:-elif.kaya@ogr.universite.edu.tr}
      DEV_STUDENT_PASSWORD: ${DEV_STUDENT_PASSWORD:-demo-ogrenci-2026}
      DEV_STUDENT_NAME: ${DEV_STUDENT_NAME:-Elif Kaya}
    # Açılışta (hepsi tekrar çalıştırılabilir): şemayı güncelle, demo dersini (ve açıksa
    # geliştirme hesaplarını) oluştur,
    # embedding modelini hazırla (ilk seferde ~1 GB indirir), vektörü eksik ya da başka
    # embedder'la üretilmiş parçaları yeniden üret.
    # Model indirildikten sonra internet gerekmez (HF_HUB_OFFLINE): sunumda bağlantı olmasa da açılır.
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.seed_demo &&
             (python -m app.scripts.download_models || echo 'Model indirilemedi; önbellek kullanılacak') &&
             export HF_HUB_OFFLINE=1 && python -m app.scripts.reembed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/code/app
      - ./backend/migrations:/code/migrations
      # Yüklenen ders materyalleri ve sayfa görüntüleri (git'e girmez)
      - ./data:/code/data
      # Embedding modeli: bir kez indirilir, sonra internetsiz kullanılır
      - models:/models
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
  models:
