[project]
name = "learning-assistant-backend"
version = "0.0.1"
description = "Interactive Learning Assistant — FastAPI backend (iskelet)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=1,<2",
    "fastapi>=0.115",
    "openai>=3,<4",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
# Yerel embedding modeli (multilingual-e5). Docker'da kurulur; CI ve testler sahte embedder kullanır.
embeddings = [
    "sentence-transformers>=6,<7",
]
dev = [
    "pytest>=8.3",
    "httpx2>=2.13",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PyMuPDF'in SWIG bağlamalarından gelen, bizi ilgilendirmeyen uyarılar
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]

[tool.ruff.lint.per-file-ignores]
# Alembic'in ürettiği migration dosyaları
"migrations/versions/*.py" = ["E501", "I001", "UP"]
